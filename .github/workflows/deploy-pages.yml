name: Deploy LET ERP to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - DEPLOYED.txt
      - DEPLOY_FAILED.txt
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild LET ERP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site /tmp/let-erp.zip /tmp/let-erp.b64
          mkdir -p _site
          cat .payload2/part-{000..009} > /tmp/let-erp.b64
          cat .payload2/part-010a .payload2/part-010b >> /tmp/let-erp.b64
          cat .payload2/part-{011..017} >> /tmp/let-erp.b64
          tr -d '\n' < /tmp/let-erp.b64 | base64 -d > /tmp/let-erp.zip
          unzip -t /tmp/let-erp.zip
          unzip -q /tmp/let-erp.zip -d _site
          cp overrides/acessos.html _site/acessos.html
          cp overrides/reenvios.html _site/reenvios.html
          cp overrides/limpeza_historicos.html _site/limpeza_historicos.html
          python3 overrides/v33-base-patch.py
          python3 overrides/developer-badge-patch.py
          python3 overrides/v35-patch.py
          python3 overrides/v35-finalize.py

      - name: Validate LET ERP v38
        shell: bash
        run: |
          set -euo pipefail
          node --check _site/theme.js
          node --check _site/factory-suite.js
          node --check _site/navigation-v38.js
          test -s _site/painel_producao.html
          test -s _site/theme.js
          test -s _site/supabase-config.js
          test -s _site/navigation-v38.js
          test -s _site/pedido.html
          test -s _site/kanban.html
          test -s _site/expedicao.html
          test -s _site/perfil.html
          grep -q 'versão 38' _site/painel_producao.html
          grep -q 'LET_ERP_V38_NAVIGATION_UX' _site/navigation-v38.js
          grep -q 'v38-search' _site/navigation-v38.js
          grep -q 'v38-crumbwrap' _site/navigation-v38.js
          grep -q 'menu_favoritos' _site/navigation-v38.js
          grep -q 'v38-group' _site/navigation-v38.js
          grep -q 'navigation-v38.js?v=20260818-v38-navigation-ux' _site/painel_producao.html
          grep -q 'let-erp-chat-button' _site/theme.js
          grep -q 'MATERIAL MKT' _site/painel_producao.html
          grep -q 'CENTRAL DO PEDIDO' _site/painel_producao.html
          grep -q 'qualityGateModal' _site/painel_producao.html
          grep -q 'pedido_comentarios' _site/pedido.html
          grep -q 'pedido_arquivos' _site/pedido.html
          grep -q 'pedido_estoque_itens' _site/pedido.html

      - name: Diagnose legacy inline scripts
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          files=['login.html','acessos.html','perfil.html','reenvios.html','limpeza_historicos.html','painel_producao.html','novo_pedido.html','atividades.html','kanban.html','permissoes.html','expedicao.html','pedido.html']
          for fn in files:
              path=Path('_site',fn)
              if not path.exists():
                  continue
              txt=path.read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',txt,flags=re.I|re.S)
              for js in scripts:
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                      f.write(js); name=f.name
                  r=subprocess.run(['node','--check',name],capture_output=True,text=True)
                  Path(name).unlink(missing_ok=True)
                  if r.returncode:
                      print('Aviso de script legado em',fn)
                      print(r.stderr)
          PY

      - name: Prepare Pages root
        shell: bash
        run: |
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="refresh" content="0; url=login.html">
            <title>LET ERP</title>
            <script>location.replace("login.html"+location.search+location.hash);</script>
          </head>
          <body></body>
          </html>
          EOF
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment
        if: success()
        shell: bash
        run: |
          rm -f DEPLOY_FAILED.txt
          printf 'commit=%s\nversion=38\ndeployed_at=%s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > DEPLOYED.txt
          git config user.name 'LET ERP Deploy Bot'
          git config user.email 'actions@github.com'
          git add -A DEPLOYED.txt DEPLOY_FAILED.txt
          git commit -m "chore: registra deploy v38 concluído [skip deploy]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Record build failure
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo "commit=$GITHUB_SHA"
            echo "version=38"
            echo "failed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "panel=$(test -s _site/painel_producao.html && echo present || echo missing)"
            echo "navigation_v38=$(test -s _site/navigation-v38.js && echo present || echo missing)"
            echo "panel_v38=$(grep -q 'versão 38' _site/painel_producao.html 2>/dev/null && echo yes || echo no)"
            echo "search=$(grep -q 'v38-search' _site/navigation-v38.js 2>/dev/null && echo yes || echo no)"
            echo "favorites=$(grep -q 'menu_favoritos' _site/navigation-v38.js 2>/dev/null && echo yes || echo no)"
            echo "breadcrumbs=$(grep -q 'v38-crumbwrap' _site/navigation-v38.js 2>/dev/null && echo yes || echo no)"
          } > DEPLOY_FAILED.txt
          git config user.name 'LET ERP Deploy Bot'
          git config user.email 'actions@github.com'
          git add DEPLOY_FAILED.txt
          git commit -m "chore: registra falha de deploy v38 [skip deploy]" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
