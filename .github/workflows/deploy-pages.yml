name: Deploy LET ERP to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild LET ERP package
        shell: bash
        run: |
          rm -rf _site /tmp/let-erp.zip /tmp/let-erp.b64
          mkdir -p _site
          cat .payload2/part-{000..009} > /tmp/let-erp.b64
          cat .payload2/part-010a .payload2/part-010b >> /tmp/let-erp.b64
          cat .payload2/part-{011..017} >> /tmp/let-erp.b64
          tr -d '\n' < /tmp/let-erp.b64 | base64 -d > /tmp/let-erp.zip
          unzip -t /tmp/let-erp.zip
          unzip -q /tmp/let-erp.zip -d _site
          cp overrides/acessos.html _site/acessos.html

          python3 - <<'PY'
          from pathlib import Path
          import re

          theme=Path('_site/theme.js')
          s=theme.read_text(encoding='utf-8')

          nav_old='''    {href:"atividades.html", icon:"🧾", label:"Atividades", sub:"Quem alterou cada módulo"},\n    {href:"perfil.html", icon:"👤", label:"Meu Perfil", sub:"Nome, setor e foto"}'''
          nav_new='''    {href:"atividades.html", icon:"🧾", label:"Atividades", sub:"Quem alterou cada módulo"},\n    {href:"acessos.html", icon:"🔐", label:"Gerenciar Acessos", sub:"Criar usuários e redefinir senhas", adminOnly:true},\n    {href:"perfil.html", icon:"👤", label:"Meu Perfil", sub:"Nome, setor e foto"}'''
          if nav_old not in s:
              raise SystemExit('Trecho NAV_ITEMS não encontrado')
          s=s.replace(nav_old,nav_new,1)

          needle='  function ensureNavigation(){\n    if(document.querySelector(".let-erp-menu-button"))return;'
          replacement='  function ensureNavigation(){\n    const routePage=(location.pathname.split("/").pop()||"").toLowerCase();\n    if(routePage==="login.html"||routePage==="index.html"||routePage==="")return;\n    if(document.querySelector(".let-erp-menu-button"))return;'
          if needle not in s:
              raise SystemExit('Trecho ensureNavigation não encontrado')
          s=s.replace(needle,replacement,1)

          old_map='''    const links=NAV_ITEMS.map(item=>{\n      const active=page===item.href.toLowerCase();\n      return '<a class="let-erp-drawer-link '+(active?'active':'')+'" href="'+item.href+'">'+'''
          new_map='''    const links=NAV_ITEMS.map(item=>{\n      const active=page===item.href.toLowerCase();\n      const adminAttrs=item.adminOnly?' data-admin-only="true" style="display:none"':'';\n      return '<a class="let-erp-drawer-link '+(active?'active':'')+'" href="'+item.href+'"'+adminAttrs+'>'+'''
          if old_map not in s:
              raise SystemExit('Trecho de links do menu não encontrado')
          s=s.replace(old_map,new_map,1)

          admin_func='''  async function hydrateAdminNavigation(){\n    let tries=0;\n    while(!window.letErpSupabase && tries<50){\n      await new Promise(r=>setTimeout(r,100));\n      tries++;\n    }\n    if(!window.letErpSupabase)return;\n    try{\n      const {data}=await window.letErpSupabase.auth.getSession();\n      const uid=data?.session?.user?.id;\n      if(!uid)return;\n      const {data:adminRow}=await window.letErpSupabase.from("erp_admins").select("user_id").eq("user_id",uid).maybeSingle();\n      if(adminRow){\n        document.querySelectorAll('[data-admin-only="true"]').forEach(el=>el.style.display="");\n      }\n    }catch(e){console.warn("Não foi possível validar menu administrativo:",e)}\n  }\n\n'''
          s=s.replace('  function ensureNavigation(){',admin_func+'  function ensureNavigation(){',1)
          s=s.replace('    document.body.appendChild(drawer);\n    hydrateDrawerProfile();','    document.body.appendChild(drawer);\n    hydrateDrawerProfile();\n    hydrateAdminNavigation();',1)

          s=s.replace(
              'position:fixed;left:0;top:0;bottom:0;width:min(330px,88vw);z-index:9998;\n      background:#fff;box-shadow:18px 0 50px rgba(15,23,42,.22);\n      transform:translateX(-105%);transition:transform .24s ease;',
              'position:fixed;right:0;left:auto;top:0;bottom:0;width:min(330px,88vw);z-index:9998;\n      background:#fff;box-shadow:-18px 0 50px rgba(15,23,42,.22);\n      transform:translateX(105%);transition:transform .24s ease;',
              1
          )
          theme.write_text(s,encoding='utf-8')

          login=Path('_site/login.html')
          t=login.read_text(encoding='utf-8')
          t=t.replace('''        <button class="signup" id="signupBtn" type="button">CRIAR ACESSO</button>\n        <button class="signup" id="resendBtn" type="button">REENVIAR CONFIRMAÇÃO</button>\n''','')
          t=t.replace('''    <div class="note">Depois de criar os usuários da equipe, recomendamos desativar novos cadastros públicos no Supabase para deixar o sistema restrito à fábrica.</div>''','''    <div class="note">Os acessos são criados pela administração do LET ERP. Se você não consegue entrar, peça para um administrador redefinir sua senha.</div>''')
          t=t.replace("if(error){if(error.code==='email_not_confirmed'||String(error.message).toLowerCase().includes('email not confirmed'))showError('Seu e-mail ainda não foi confirmado. Abra o e-mail do Supabase ou clique em REENVIAR CONFIRMAÇÃO.');else showError('Não foi possível entrar: '+error.message);return}","if(error){if(error.code==='email_not_confirmed'||String(error.message).toLowerCase().includes('email not confirmed'))showError('Seu e-mail ainda não foi liberado. Peça para um administrador do LET ERP redefinir seu acesso.');else showError('Não foi possível entrar. Confira o e-mail e a senha ou peça para um administrador redefinir seu acesso.');return}")
          t=re.sub(r"document\.getElementById\('resendBtn'\)[\s\S]*?document\.getElementById\('signupBtn'\)[\s\S]*?\n\}\);\n",'',t,count=1)
          login.write_text(t,encoding='utf-8')

          panel=Path('_site/painel_producao.html')
          pt=panel.read_text(encoding='utf-8')
          pt=re.sub(r'<div class="version">versão \d+(?: • Supabase)?</div>','<div class="version">versão 33 • Supabase</div>',pt,count=1)
          panel.write_text(pt,encoding='utf-8')

          cache_tag='20260817-v33-access-admin'
          for html in Path('_site').glob('*.html'):
              text=html.read_text(encoding='utf-8')
              text=text.replace('src="theme.js"',f'src="theme.js?v={cache_tag}"')
              text=text.replace('src="supabase-config.js"',f'src="supabase-config.js?v={cache_tag}"')
              html.write_text(text,encoding='utf-8')
          PY

          python3 overrides/developer-badge-patch.py

          node --check _site/theme.js

          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          for fn in ['login.html','acessos.html','perfil.html']:
              txt=Path('_site',fn).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>',txt,flags=re.I|re.S)
              for js in scripts:
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                      f.write(js); name=f.name
                  r=subprocess.run(['node','--check',name],capture_output=True,text=True)
                  Path(name).unlink(missing_ok=True)
                  if r.returncode:
                      print(r.stderr); sys.exit(1)
          PY

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="refresh" content="0; url=login.html">
            <title>LET ERP</title>
            <script>location.replace("login.html"+location.search+location.hash);</script>
          </head>
          <body></body>
          </html>
          EOF
          touch _site/.nojekyll

          grep -q 'let-erp-chat-button' _site/theme.js
          grep -q 'MATERIAL MKT' _site/painel_producao.html
          grep -q 'Gerenciar Acessos' _site/theme.js
          grep -q 'gerenciar-acessos' _site/acessos.html
          grep -q 'developerBadgeHtml' _site/theme.js
          grep -q 'profileDeveloperBadge' _site/perfil.html
          test -s _site/developer-badge.png
          grep -q 'versão 34' _site/painel_producao.html
          grep -q 'theme.js?v=20260817-v34-developer-badge' _site/painel_producao.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
