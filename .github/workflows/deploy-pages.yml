name: Deploy LET ERP to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - DEPLOYED.txt
      - DEPLOY_FAILED.txt
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Montar LET ERP v37.5
        shell: bash
        run: |
          rm -rf _site /tmp/let-erp.zip /tmp/let-erp.b64
          mkdir -p _site
          cat .payload2/part-{000..009} > /tmp/let-erp.b64
          cat .payload2/part-010a .payload2/part-010b >> /tmp/let-erp.b64
          cat .payload2/part-{011..017} >> /tmp/let-erp.b64
          tr -d '\n' < /tmp/let-erp.b64 | base64 -d > /tmp/let-erp.zip
          unzip -t /tmp/let-erp.zip
          unzip -q /tmp/let-erp.zip -d _site
          cp overrides/acessos.html _site/acessos.html
          cp overrides/reenvios.html _site/reenvios.html
          cp overrides/limpeza_historicos.html _site/limpeza_historicos.html

          python3 overrides/deploy-base-patch.py
          python3 overrides/developer-badge-patch.py
          python3 overrides/v35-patch.py
          python3 overrides/v35-finalize.py

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="refresh" content="0; url=login.html">
            <title>LET ERP</title>
            <script>location.replace("login.html"+location.search+location.hash);</script>
          </head>
          <body></body>
          </html>
          EOF
          touch _site/.nojekyll

      - name: Validar JavaScript principal
        shell: bash
        run: |
          node --check _site/theme.js
          node --check _site/factory-suite.js
          node --check _site/navigation-v37-5.js

      - name: Validar recursos atuais
        shell: bash
        run: |
          test -s _site/painel_producao.html
          test -s _site/navigation-v37-5.js
          test -s _site/expedicao.html
          grep -q 'versão 37.5' _site/painel_producao.html
          grep -q 'qualityGateModal' _site/painel_producao.html
          grep -q 'CENTRAL DO PEDIDO' _site/painel_producao.html
          grep -q 'MATERIAL MKT' _site/painel_producao.html
          grep -q 'v37-role-permissions-enforced' _site/painel_producao.html
          grep -q 'let-erp-chat-button' _site/theme.js
          grep -q 'Gerenciar Acessos' _site/theme.js
          grep -q 'href:"reenvios.html"' _site/theme.js
          grep -q 'limpeza_historicos.html' _site/theme.js
          grep -q 'CRIAR RETIRADA' _site/expedicao.html
          grep -q 'let-erp-menu-group' _site/navigation-v37-5.js
          grep -q 'let-erp-menu-star' _site/navigation-v37-5.js
          grep -q 'menu_favoritos' _site/navigation-v37-5.js
          grep -q 'body>.topbar' _site/navigation-v37-5.js

      - name: Registrar falha
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo "commit=$GITHUB_SHA"
            echo "version=37.5"
            echo "failed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            test -f _site/painel_producao.html && echo 'panel=present' || echo 'panel=MISSING'
            test -f _site/navigation-v37-5.js && echo 'navigation=present' || echo 'navigation=MISSING'
            grep -q 'versão 37.5' _site/painel_producao.html 2>/dev/null && echo 'panel_v37_5=yes' || echo 'panel_v37_5=no'
            grep -q 'let-erp-menu-group' _site/navigation-v37-5.js 2>/dev/null && echo 'grouped_menu=yes' || echo 'grouped_menu=no'
            grep -q 'menu_favoritos' _site/navigation-v37-5.js 2>/dev/null && echo 'favorites=yes' || echo 'favorites=no'
          } > DEPLOY_FAILED.txt
          git config user.name 'LET ERP Deploy Bot'
          git config user.email 'actions@github.com'
          git add DEPLOY_FAILED.txt
          git commit -m "chore: registra falha v37.5 [skip deploy]" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        if: success()
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Registrar publicação concluída
        if: success()
        shell: bash
        run: |
          rm -f DEPLOY_FAILED.txt
          printf 'commit=%s\nversion=37.5\ndeployed_at=%s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > DEPLOYED.txt
          git config user.name 'LET ERP Deploy Bot'
          git config user.email 'actions@github.com'
          git add -A DEPLOYED.txt DEPLOY_FAILED.txt
          git commit -m "chore: registra deploy v37.5 concluído [skip deploy]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
