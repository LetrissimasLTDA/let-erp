<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#083344"><title>LET ERP • Painel Geral da Fábrica</title><style>
:root{--a:#2dd4cf;--d:#083344}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:#061f2a;color:#fff}body{overflow:hidden}.shell{height:100vh;padding:18px 22px;display:grid;grid-template-rows:auto auto 1fr auto;gap:14px;background:radial-gradient(circle at 20% 0%,rgba(45,212,207,.15),transparent 35%),linear-gradient(145deg,#061f2a,#0a3443)}header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:1000}.brand small{display:block;color:#99f6e4;font-size:10px;margin-top:3px}.clock{text-align:right;font-size:30px;font-weight:1000}.clock small{display:block;font-size:10px;color:#99f6e4}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.m{background:#fff;color:#0f172a;border-radius:15px;padding:13px}.m small{font-size:8px;color:#64748b;font-weight:950}.m b{font-size:30px;display:block;margin-top:4px}.m.red{background:#fee2e2}.m.yellow{background:#fef3c7}.main{display:grid;grid-template-columns:2fr 1fr;gap:12px;min-height:0}.panel{background:#fff;color:#0f172a;border-radius:18px;padding:14px;min-height:0}.panel h2{margin:0;font-size:16px}.stages{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:12px}.stage{border:1px solid #e2e8f0;border-radius:12px;padding:10px;text-align:center}.stage b{font-size:26px;display:block}.stage small{font-size:8px;color:#64748b;font-weight:950}.stage.risk{background:#fffbeb;border-color:#f59e0b}.stage.over{background:#fef2f2;border-color:#dc2626}.queue{display:grid;gap:7px;margin-top:10px;max-height:calc(100vh - 330px);overflow:hidden}.q{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #e5e7eb;padding:8px 0}.q strong{font-size:10px}.q span{font-size:9px;color:#64748b}.goal{margin-top:14px}.track{height:13px;border-radius:999px;background:#e2e8f0;overflow:hidden}.bar{height:100%;background:#2dd4cf}.goal-line{display:flex;justify-content:space-between;margin-bottom:6px;font-size:10px;font-weight:950}.footer{display:flex;justify-content:space-between;color:#cbd5e1;font-size:9px;font-weight:850}@media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr)}.main{grid-template-columns:1fr}.stages{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="shell"><header><div class="brand">LET ERP<small>📺 PAINEL GERAL DA FÁBRICA</small></div><div class="clock" id="clock">--:--:--<small id="date">--</small></div></header><div class="metrics"><div class="m"><small>PEDIDOS DE HOJE</small><b id="today">0</b></div><div class="m"><small>FINALIZADOS HOJE</small><b id="done">0</b></div><div class="m"><small>EM PRODUÇÃO</small><b id="active">0</b></div><div class="m red"><small>ATRASOS</small><b id="late">0</b></div><div class="m yellow"><small>SLA EM RISCO</small><b id="risk">0</b></div><div class="m"><small>REFUGOS HOJE</small><b id="scrap">0</b></div></div><div class="main"><section class="panel"><h2>🌡️ Carga por setor</h2><div class="stages" id="stages"></div><div class="goal"><div class="goal-line"><span id="goalTitle">Meta da fábrica</span><span id="goalText">0 / 0</span></div><div class="track"><div class="bar" id="goalBar" style="width:0%"></div></div></div></section><section class="panel"><h2>🔥 Próximos pedidos prioritários</h2><div class="queue" id="queue"></div></section></div><div class="footer"><span>● Atualização em tempo real</span><span>LET ERP • Gestão da Produção</span><span>Pressione F11 para tela cheia</span></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=37"></script><script>
const db=letErpSupabase,STAGES=["Máquina","Lixação","Montagem","Colagem","Pintura","Fitagem","Embalagem"];let slas=[];function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function active(p){return !p.finalizado&&!p.entregue_marketplace&&p.status!=='Pronto'}function rank(v){return v==='Crítico'?0:v==='Urgente'?1:2}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function tick(){const d=new Date();clock.childNodes[0].nodeValue=d.toLocaleTimeString('pt-BR');date.textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}async function load(){const todayKey=key(new Date());const [{data:o},{data:s},{data:g}]=await Promise.all([db.from('pedidos').select('*'),db.from('sla_etapas').select('*'),db.from('metas_fabrica').select('*').eq('ativo',true).lte('data_inicio',todayKey).gte('data_fim',todayKey).order('criado_em',{ascending:false}).limit(1)]);const orders=o||[];slas=s||[];const act=orders.filter(active);today.textContent=orders.filter(p=>p.prazo===todayKey&&active(p)).length;done.textContent=orders.filter(p=>String(p.finalizado_em||'').startsWith(todayKey)).length;active.textContent=act.length;late.textContent=act.filter(p=>p.atrasado).length;risk.textContent=act.filter(p=>{const sla=slas.find(x=>x.etapa===p.etapa_atual)||{minutos:60};return (Date.now()-new Date(p.etapa_iniciada_em||p.atualizado_em||p.criado_em))/60000>=sla.minutos*.8}).length;scrap.textContent=orders.reduce((a,p)=>a+(Array.isArray(p.refugos)?p.refugos.filter(r=>String(r.data||'').startsWith(todayKey)).length:0),0);stages.innerHTML=STAGES.map((n,i)=>{const arr=act.filter(p=>Number(p.etapa_atual||0)===i),sla=slas.find(x=>x.etapa===i)||{minutos:60},over=arr.filter(p=>(Date.now()-new Date(p.etapa_iniciada_em||p.atualizado_em||p.criado_em))/60000>=sla.minutos).length,r=arr.filter(p=>(Date.now()-new Date(p.etapa_iniciada_em||p.atualizado_em||p.criado_em))/60000>=sla.minutos*.8).length;return '<div class="stage '+(over?'over':r?'risk':'')+'"><small>'+n.toUpperCase()+'</small><b>'+arr.length+'</b><small>'+over+' SLA estourado'+(over===1?'':'s')+'</small></div>'}).join('');queue.innerHTML=act.sort((a,b)=>rank(a.prioridade)-rank(b.prioridade)||String(a.prazo).localeCompare(String(b.prazo))).slice(0,8).map(p=>'<div class="q"><div><strong>#'+esc(p.id)+' • '+esc(p.cliente||'')+'</strong><br><span>'+esc(STAGES[p.etapa_atual||0])+'</span></div><span>'+esc(p.prioridade||'Normal')+'</span></div>').join('')||'<div style="padding:20px;text-align:center;color:#64748b">Sem pedidos ativos.</div>';const goal=(g||[])[0];if(goal){const {count}=await db.from('pedidos').select('id',{count:'exact',head:true}).gte('finalizado_em',goal.data_inicio+'T00:00:00').lte('finalizado_em',goal.data_fim+'T23:59:59');const pct=Math.min(100,Math.round((count||0)/goal.meta_pedidos*100));goalTitle.textContent=goal.titulo;goalText.textContent=(count||0)+' / '+goal.meta_pedidos+' • '+pct+'%';goalBar.style.width=pct+'%'}else{goalTitle.textContent='Nenhuma meta ativa';goalText.textContent='';goalBar.style.width='0%'}}async function init(){const s=await letErpRequireAuth();if(!s)return;tick();setInterval(tick,1000);load();setInterval(load,60000);db.channel('tv-geral-v37').on('postgres_changes',{event:'*',schema:'public',table:'pedidos'},load).subscribe()}init();
</script></body></html>
