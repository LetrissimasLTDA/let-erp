<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.png"><link rel="stylesheet" href="factory-suite.css?v=37"><script src="theme.js?v=37"></script><title>LET ERP • Kanban</title><style>
.page{max-width:none}.kanban{display:grid;grid-template-columns:repeat(7,minmax(255px,1fr));gap:10px;overflow:auto;padding-bottom:12px}.col{background:#eef3f5;border:1px solid #dbe5e8;border-radius:15px;min-height:620px;padding:9px}.col.drag{outline:3px solid #2dd4cf}.col-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 4px 10px}.col-head strong{font-size:12px}.count{background:#083344;color:#fff;border-radius:999px;padding:4px 7px;font-size:8px;font-weight:950}.sla{font-size:8px;color:#64748b;font-weight:850}.cards{display:grid;gap:8px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px;box-shadow:0 2px 6px rgba(15,23,42,.04);cursor:grab}.card.critical{border-left:5px solid #dc2626}.card.urgent{border-left:5px solid #f59e0b}.card.over{box-shadow:0 0 0 2px #fecaca}.card-top{display:flex;justify-content:space-between;gap:8px}.card strong{font-size:11px}.client{font-size:12px;font-weight:950;margin-top:5px}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.foot{display:flex;justify-content:space-between;gap:6px;align-items:center;margin-top:8px;font-size:8px;color:#64748b}.responsavel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:135px}.sla-bar{height:5px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:8px}.sla-bar span{display:block;height:100%;background:#2dd4cf}.sla-bar span.warn{background:#f59e0b}.sla-bar span.over{background:#dc2626}@media(max-width:900px){.kanban{grid-template-columns:repeat(7,260px)}}
</style></head><body><header class="topbar"><div><h1>📋 Kanban de Produção</h1><p>Fila visual por etapa • arraste os pedidos entre os setores</p></div><div><a class="btn dark" href="gestao_producao.html">GESTÃO</a></div></header><main class="page"><div class="notice" id="notice"></div><div class="toolbar" style="margin-bottom:12px"><div><span class="chip aqua" id="total">0 pedidos ativos</span> <span class="chip yellow" id="risk">0 em risco de SLA</span></div><div><input class="input" id="search" placeholder="Pesquisar pedido ou cliente..."></div></div><section class="kanban" id="kanban"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=37"></script><script src="factory-suite.js?v=37"></script><script>
const db=letErpSupabase;let orders=[],profiles={},slas=[],canEdit=false;const STAGES=ERP_STAGES;
function active(p){return !p.finalizado&&!p.entregue_marketplace&&p.status!=="Pronto"}
function elapsed(p){return Math.max(0,Date.now()-new Date(p.etapa_iniciada_em||p.atualizado_em||p.criado_em).getTime())/60000}
function slaFor(i){return slas.find(s=>s.etapa===i)||{minutos:60}}
function pct(p){return Math.round(elapsed(p)/Math.max(1,slaFor(p.etapa_atual).minutos)*100)}
function sortOrders(a,b){return erpPriorityRank(a.prioridade)-erpPriorityRank(b.prioridade)||String(a.prazo).localeCompare(String(b.prazo))}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const list=orders.filter(active).filter(p=>!q||[p.id,p.cliente].some(v=>String(v||'').toLowerCase().includes(q))).sort(sortOrders);document.getElementById('total').textContent=list.length+' pedidos ativos';document.getElementById('risk').textContent=list.filter(p=>pct(p)>=80).length+' em risco de SLA';document.getElementById('kanban').innerHTML=STAGES.map((name,i)=>{const arr=list.filter(p=>Number(p.etapa_atual||0)===i);return '<article class="col" data-stage="'+i+'"><div class="col-head"><div><strong>'+name+'</strong><div class="sla">SLA '+slaFor(i).minutos+' min</div></div><div><span class="count">'+arr.length+'</span> <a class="btn gray" style="padding:5px 7px" target="_blank" href="tv_setor.html?etapa='+i+'">📺</a></div></div><div class="cards">'+(arr.length?arr.map(card).join(''):'<div class="empty" style="padding:20px">Sem pedidos</div>')+'</div></article>'}).join('');bindDrag()}
function card(p){const percent=pct(p),prof=profiles[p.responsavel_atual],cls=p.prioridade==='Crítico'?'critical':p.prioridade==='Urgente'?'urgent':'';const tags=Array.isArray(p.etiquetas)?p.etiquetas:[];return '<div class="card '+cls+(percent>=100?' over':'')+'" draggable="'+canEdit+'" data-id="'+erpEsc(p.id)+'" onclick="if(!event.defaultPrevented)location.href=\'pedido.html?id='+encodeURIComponent(p.id)+'\'"><div class="card-top"><strong>#'+erpEsc(p.id)+'</strong>'+erpPriorityChip(p.prioridade)+'</div><div class="client">'+erpEsc(p.cliente||'Sem cliente')+'</div><div class="meta">'+(p.marketplace?'<span class="chip">'+erpEsc(p.marketplace)+'</span>':'')+(p.espessura?'<span class="chip">'+erpEsc(p.espessura)+'</span>':'')+tags.slice(0,2).map(t=>'<span class="chip blue">'+erpEsc(t)+'</span>').join('')+'</div><div class="sla-bar"><span class="'+(percent>=100?'over':percent>=80?'warn':'')+'" style="width:'+Math.min(100,percent)+'%"></span></div><div class="foot"><span>SLA '+percent+'%</span><span class="responsavel">👷 '+erpEsc(prof?.nome||p.producao_operador_atual||'Sem responsável')+'</span></div></div>'}
function bindDrag(){document.querySelectorAll('.card[draggable="true"]').forEach(c=>{c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move'});});document.querySelectorAll('.col').forEach(col=>{col.addEventListener('dragover',e=>{if(!canEdit)return;e.preventDefault();col.classList.add('drag')});col.addEventListener('dragleave',()=>col.classList.remove('drag'));col.addEventListener('drop',async e=>{e.preventDefault();col.classList.remove('drag');const id=e.dataTransfer.getData('text/plain'),stage=Number(col.dataset.stage);const {error}=await db.from('pedidos').update({etapa_atual:stage,status:'Em produção',finalizado:false}).eq('id',id);if(error)erpShowNotice('Erro ao mover pedido: '+error.message,true);else erpShowNotice('Pedido #'+id+' movido para '+STAGES[stage]+'.')})})}
async function load(){const [{data:o},{data:p},{data:s}]=await Promise.all([db.from('pedidos').select('*'),db.from('perfis').select('id,nome,setor'),db.from('sla_etapas').select('*').order('etapa')]);orders=o||[];profiles=Object.fromEntries((p||[]).map(x=>[x.id,x]));slas=s||[];render()}
async function init(){if(!(await erpRequire(null)))return;canEdit=await erpHas('pedidos_editar');await load();document.getElementById('search').addEventListener('input',render);db.channel('kanban-v37').on('postgres_changes',{event:'*',schema:'public',table:'pedidos'},load).on('postgres_changes',{event:'*',schema:'public',table:'sla_etapas'},load).subscribe();setInterval(render,30000)}init();
</script></body></html>
