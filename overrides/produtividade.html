<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.png"><link rel="stylesheet" href="factory-suite.css?v=37"><script src="theme.js?v=37"></script><title>LET ERP • Produtividade</title><style>.bar{display:flex;align-items:center;gap:9px}.bar-track{flex:1;height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden}.bar-track span{display:block;height:100%;background:#2dd4cf}.rank{display:grid;gap:7px}.rank-row{display:grid;grid-template-columns:44px 220px 110px 1fr 100px;gap:10px;align-items:center;border-bottom:1px solid #e5e7eb;padding:8px 0}.stage-row{display:grid;grid-template-columns:140px 80px 1fr 110px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #e5e7eb}@media(max-width:800px){.rank-row,.stage-row{grid-template-columns:44px 1fr}.rank-row>*:nth-child(n+3),.stage-row>*:nth-child(n+3){grid-column:2}}</style></head><body><header class="topbar"><div><h1>🏆 Produtividade</h1><p>Desempenho por funcionário e setor com base no histórico real das etapas</p></div></header><main class="page"><div class="notice" id="notice"></div><section class="panel"><div class="toolbar"><div><button class="btn dark preset" data-days="7">7 DIAS</button> <button class="btn gray preset" data-days="15">15 DIAS</button> <button class="btn gray preset" data-days="30">30 DIAS</button></div><div><input class="input" type="date" id="start"> <input class="input" type="date" id="end"> <button class="btn aqua" id="apply">APLICAR</button></div></div></section><section class="metrics"><div class="metric"><small>PEDIDOS FINALIZADOS</small><b id="finished">0</b></div><div class="metric"><small>TEMPO MÉDIO TOTAL</small><b id="avgTotal">00:00:00</b></div><div class="metric"><small>ETAPAS CONCLUÍDAS</small><b id="stageEvents">0</b></div><div class="metric"><small>REFUGOS / REPINTURAS</small><b id="refugos">0</b></div></section><section class="grid2"><div class="panel"><div class="toolbar"><h2>Funcionários</h2><span class="muted" style="font-size:9px">Tempo por etapas encerradas</span></div><div class="rank" id="people"></div></div><div class="panel"><div class="toolbar"><h2>Setores</h2><span class="muted" style="font-size:9px">Volume e tempo médio</span></div><div id="sectors"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=37"></script><script src="factory-suite.js?v=37"></script><script>
const db=letErpSupabase;let start='',end='';function setRange(days){const e=new Date(),s=new Date();s.setDate(s.getDate()-days+1);start=erpDateKey(s);end=erpDateKey(e);document.getElementById('start').value=start;document.getElementById('end').value=end;load()}
async function load(){const from=start+'T00:00:00',to=end+'T23:59:59';const [{data:h},{data:p},{data:o}]=await Promise.all([db.from('pedido_etapas_historico').select('*').gte('entrou_em',from).lte('entrou_em',to),db.from('perfis').select('id,nome,setor,email,foto_url'),db.from('pedidos').select('id,finalizado_em,producao_segundos_acumulados,refugos').gte('finalizado_em',from).lte('finalizado_em',to)]);const hist=(h||[]).filter(x=>x.saiu_em),profiles=Object.fromEntries((p||[]).map(x=>[x.id,x])),orders=o||[];document.getElementById('finished').textContent=orders.length;document.getElementById('avgTotal').textContent=erpFmtDuration(orders.length?orders.reduce((a,x)=>a+Number(x.producao_segundos_acumulados||0),0)/orders.length:0);document.getElementById('stageEvents').textContent=hist.length;document.getElementById('refugos').textContent=orders.reduce((a,x)=>a+(Array.isArray(x.refugos)?x.refugos.length:0),0);const byPerson={};hist.forEach(x=>{if(!x.responsavel_id)return;const k=x.responsavel_id;byPerson[k]??={count:0,secs:0};byPerson[k].count++;byPerson[k].secs+=Number(x.duracao_segundos||0)});const max=Math.max(1,...Object.values(byPerson).map(x=>x.count));const people=Object.entries(byPerson).sort((a,b)=>b[1].count-a[1].count);document.getElementById('people').innerHTML=people.length?people.map(([id,v])=>{const pr=profiles[id]||{};return '<div class="rank-row"><div class="avatar">'+(pr.foto_url?'<img src="'+erpEsc(pr.foto_url)+'">':'👤')+'</div><div><strong style="font-size:10px">'+erpEsc(pr.nome||pr.email||'Funcionário')+'</strong><div class="muted" style="font-size:8px">'+erpEsc(pr.setor||'')+'</div></div><b>'+v.count+' etapas</b><div class="bar"><div class="bar-track"><span style="width:'+(v.count/max*100)+'%"></span></div></div><span>'+erpFmtDuration(v.count?v.secs/v.count:0)+'</span></div>'}).join(''):'<div class="empty">Sem dados no período.</div>';const byStage={};hist.forEach(x=>{const k=Number(x.etapa);byStage[k]??={count:0,secs:0};byStage[k].count++;byStage[k].secs+=Number(x.duracao_segundos||0)});const stageMax=Math.max(1,...Object.values(byStage).map(x=>x.count));document.getElementById('sectors').innerHTML=ERP_STAGES.map((name,i)=>{const v=byStage[i]||{count:0,secs:0};return '<div class="stage-row"><strong>'+name+'</strong><b>'+v.count+'</b><div class="bar-track"><span style="width:'+(v.count/stageMax*100)+'%"></span></div><span>'+erpFmtDuration(v.count?v.secs/v.count:0)+'</span></div>'}).join('')}
async function init(){if(!(await erpRequire('gestao')))return;setRange(7);document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>setRange(Number(b.dataset.days))));document.getElementById('apply').addEventListener('click',()=>{start=document.getElementById('start').value;end=document.getElementById('end').value;if(!start||!end||start>end)return alert('Período inválido');load()})}init();
</script></body></html>
