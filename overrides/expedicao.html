<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="factory-suite.css?v=37.2">
  <script src="theme.js?v=37.2"></script>
  <title>LET ERP • Expedição</title>
  <style>
    .pickup-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
    .pickup-form .field{margin:0}.pickup-form .action{display:flex;align-items:flex-end}
    .history{display:grid;gap:10px;margin-top:12px}
    .pickup-card{display:grid;grid-template-columns:150px 120px 1fr 150px;gap:14px;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px 16px}
    .pickup-card .date strong{display:block;font-size:16px;color:#083344}.pickup-card .date small,.pickup-card .meta small{display:block;font-size:9px;color:#64748b;font-weight:850;margin-bottom:3px}
    .pickup-card .time{font-size:22px;font-weight:1000;color:#0f172a}.pickup-card .market{font-size:14px;font-weight:950}.pickup-card .total{text-align:right}.pickup-card .total b{display:block;font-size:24px;color:#0f766e}.pickup-card .total span{font-size:9px;color:#64748b;font-weight:900}
    .empty-simple{padding:36px 18px;text-align:center;border:1px dashed #cbd5e1;border-radius:14px;color:#64748b;font-size:12px;font-weight:850;background:#fff}
    @media(max-width:900px){.pickup-form{grid-template-columns:1fr 1fr}.pickup-card{grid-template-columns:1fr 1fr}.pickup-card .total{text-align:left}}
    @media(max-width:560px){.pickup-form{grid-template-columns:1fr}.pickup-card{grid-template-columns:1fr}.pickup-card .total{text-align:left}}
  </style>
</head>
<body>
<header class="topbar"><div><h1>📦 Expedição</h1><p>Criar retiradas e consultar o histórico</p></div></header>
<main class="page">
  <div class="notice" id="notice"></div>

  <section class="panel">
    <div class="panel-head"><div><h2>CRIAR RETIRADA</h2><p>Informe quando o marketplace fará a retirada e quantos pedidos serão levados.</p></div></div>
    <form id="pickupForm" class="pickup-form">
      <div class="field"><label>DIA</label><input class="input" id="pickupDate" type="date" required></div>
      <div class="field"><label>HORÁRIO</label><input class="input" id="pickupTime" type="time" required></div>
      <div class="field"><label>MARKETPLACE</label><select class="select" id="pickupMarketplace" required><option value="">SELECIONE</option><option>SHOPEE</option><option>TIKTOK</option><option>MERCADO LIVRE</option></select></div>
      <div class="field"><label>TOTAL DE PEDIDOS</label><input class="input" id="pickupTotal" type="number" min="1" step="1" placeholder="Ex.: 45" required></div>
      <div class="action" style="grid-column:1/-1;justify-content:flex-end"><button class="btn dark" id="savePickup" type="submit">＋ CRIAR RETIRADA</button></div>
    </form>
  </section>

  <section class="panel" style="margin-top:14px">
    <div class="panel-head"><div><h2>HISTÓRICO DE RETIRADAS</h2><p>Retiradas cadastradas, da mais recente para a mais antiga.</p></div><span class="chip aqua" id="historyCount">0 retiradas</span></div>
    <div class="history" id="history"><div class="empty-simple">Carregando retiradas...</div></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=37.2"></script>
<script src="factory-suite.js?v=37.2"></script>
<script>
const db=letErpSupabase;let currentUser=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const formatDate=v=>{if(!v)return'-';const [y,m,d]=String(v).split('-');return d+'/'+m+'/'+y};
const formatTime=v=>String(v||'').slice(0,5);
function render(list){
  const el=document.getElementById('history');
  document.getElementById('historyCount').textContent=list.length+' retirada'+(list.length===1?'':'s');
  if(!list.length){el.innerHTML='<div class="empty-simple">Nenhuma retirada cadastrada ainda.</div>';return}
  el.innerHTML=list.map(r=>'<article class="pickup-card">'+
    '<div class="date"><small>DIA</small><strong>'+esc(formatDate(r.data_retirada))+'</strong></div>'+ 
    '<div><small style="font-size:9px;color:#64748b;font-weight:850">HORÁRIO</small><div class="time">'+esc(formatTime(r.horario))+'</div></div>'+ 
    '<div class="meta"><small>MARKETPLACE</small><div class="market">'+esc(r.marketplace)+'</div></div>'+ 
    '<div class="total"><b>'+Number(r.total_pedidos||0)+'</b><span>PEDIDOS</span></div>'+ 
  '</article>').join('');
}
async function load(){
  const {data,error}=await db.from('retiradas_expedicao').select('*').order('data_retirada',{ascending:false}).order('horario',{ascending:false}).order('id',{ascending:false});
  if(error){erpShowNotice('Erro ao carregar retiradas: '+error.message,true);return}
  render(data||[]);
}
document.getElementById('pickupForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('savePickup');btn.disabled=true;btn.textContent='SALVANDO...';
  try{
    const payload={
      data_retirada:document.getElementById('pickupDate').value,
      horario:document.getElementById('pickupTime').value,
      marketplace:document.getElementById('pickupMarketplace').value,
      total_pedidos:Number(document.getElementById('pickupTotal').value),
      criado_por:currentUser.id
    };
    const {error}=await db.from('retiradas_expedicao').insert(payload);
    if(error)throw error;
    erpShowNotice('Retirada criada com sucesso.');
    document.getElementById('pickupTime').value='';
    document.getElementById('pickupMarketplace').value='';
    document.getElementById('pickupTotal').value='';
    await load();
  }catch(err){erpShowNotice('Erro ao criar retirada: '+err.message,true)}
  finally{btn.disabled=false;btn.textContent='＋ CRIAR RETIRADA'}
});
async function init(){
  if(!(await erpRequire(null)))return;
  const {data}=await db.auth.getUser();currentUser=data.user;if(!currentUser)return;
  document.getElementById('pickupDate').value=new Date().toISOString().slice(0,10);
  await load();
  db.channel('retiradas-expedicao-live').on('postgres_changes',{event:'*',schema:'public',table:'retiradas_expedicao'},load).subscribe();
}
init();
</script>
<!-- compat: expedicao_status -->
</body>
</html>
