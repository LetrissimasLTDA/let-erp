<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#083344"><title>LET ERP • TV por Setor</title><style>
:root{--a:#2dd4cf;--d:#083344}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:#061f2a;color:#fff}body{overflow:hidden}.shell{height:100vh;display:grid;grid-template-rows:auto 1fr auto;background:linear-gradient(145deg,#061f2a,#0b3c4d)}header{display:grid;grid-template-columns:260px 1fr 260px;align-items:center;padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.12)}.brand{font-weight:950;font-size:18px}.brand small{display:block;color:#99f6e4;font-size:9px;margin-top:4px}.title{text-align:center}.title small{color:#99f6e4;font-weight:950;letter-spacing:.12em}.title h1{margin:2px 0 0;font-size:34px}.clock{text-align:right}.clock b{font-size:30px}.clock small{display:block;color:#99f6e4;margin-top:4px}.stage{padding:20px;min-height:0}.slide{height:100%;max-width:1450px;margin:auto;background:#fff;color:#0f172a;border-radius:24px;display:grid;grid-template-columns:40% 60%;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.28)}.logo{background:#ecfeff;padding:28px;display:flex;align-items:center;justify-content:center;border-right:1px solid #dbe5e8}.logo img{max-width:100%;max-height:100%;object-fit:contain}.logo .none{color:#94a3b8;font-size:28px;font-weight:950}.info{padding:45px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px}.id{font-size:clamp(38px,5vw,72px);font-weight:1000;color:#083344;line-height:1}.client{font-size:clamp(28px,3.5vw,50px);font-weight:1000}.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chip{padding:8px 11px;border-radius:10px;background:#f1f5f9;border:1px solid #e2e8f0;font-size:11px;font-weight:950}.chip.priority{background:#fef3c7;color:#92400e}.chip.critical{background:#fee2e2;color:#991b1b}.obs{width:min(850px,100%);background:#f8fafc;border-left:6px solid var(--a);border-radius:0 12px 12px 0;padding:13px;text-align:left}.obs small{font-size:8px;color:#64748b;font-weight:950}.obs div{margin-top:4px;font-size:15px;font-weight:800}.resp{font-size:14px;font-weight:900;color:#0f766e}.empty{height:100%;display:grid;place-items:center;text-align:center;font-size:30px;font-weight:950}.bottom{padding:0 22px 16px}.progress{height:5px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--a);animation:p 10s linear forwards}@keyframes p{from{width:0}to{width:100%}}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.btn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;padding:8px 11px;font-size:9px;font-weight:950;cursor:pointer}@media(max-width:900px){header{grid-template-columns:1fr 1fr}.title{grid-column:1/-1;grid-row:2}.slide{grid-template-columns:1fr}.logo{min-height:320px}.info{padding:25px}}
</style></head><body><div class="shell"><header><div class="brand">LET ERP<small>TV DO SETOR</small></div><div class="title"><small>FILA EM TEMPO REAL</small><h1 id="stageName">Setor</h1><div id="count" style="font-size:10px;color:#cbd5e1;font-weight:850"></div></div><div class="clock"><b id="clock">--:--:--</b><small id="date">--</small></div></header><main class="stage" id="main"><div class="empty">Carregando...</div></main><footer class="bottom"><div class="progress"><div class="bar" id="bar"></div></div><div class="controls"><div><button class="btn" id="prev">‹ ANTERIOR</button> <button class="btn" id="next">PRÓXIMO ›</button></div><div id="position">0 / 0</div><div><button class="btn" id="full">⛶ TELA CHEIA</button> <button class="btn" onclick="location.href='kanban.html'">← ERP</button></div></div></footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=37"></script><script>
const db=letErpSupabase,STAGES=["Máquina","Lixação","Montagem","Colagem","Pintura","Fitagem","Embalagem"];const stage=Math.max(0,Math.min(6,Number(new URLSearchParams(location.search).get('etapa')||0)));let orders=[],profiles={},idx=0,timer=null;document.getElementById('stageName').textContent=STAGES[stage];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function active(p){return !p.finalizado&&!p.entregue_marketplace&&p.status!=='Pronto'&&Number(p.etapa_atual||0)===stage}function rank(v){return v==='Crítico'?0:v==='Urgente'?1:2}function tick(){const d=new Date();clock.textContent=d.toLocaleTimeString('pt-BR');date.textContent=d.toLocaleDateString('pt-BR')}function render(){orders=orders.filter(active).sort((a,b)=>rank(a.prioridade)-rank(b.prioridade)||String(a.prazo).localeCompare(String(b.prazo)));if(idx>=orders.length)idx=0;count.textContent=orders.length+' pedido'+(orders.length===1?'':'s')+' neste setor';position.textContent=orders.length?(idx+1)+' / '+orders.length:'0 / 0';if(!orders.length){main.innerHTML='<div class="empty"><div>✅<br>Sem pedidos em '+STAGES[stage]+'</div></div>';restart();return}const p=orders[idx],prof=profiles[p.responsavel_atual],prio=p.prioridade||'Normal';main.innerHTML='<article class="slide"><div class="logo">'+(p.imagem?'<img src="'+esc(p.imagem)+'">':'<div class="none">SEM LOGO</div>')+'</div><div class="info"><div class="id">#'+esc(p.id)+'</div><div class="client">'+esc(p.cliente||'Sem cliente')+'</div><div class="chips"><span class="chip '+(prio==='Crítico'?'critical':prio==='Urgente'?'priority':'')+'">🔥 '+esc(prio)+'</span>'+(p.marketplace?'<span class="chip">'+esc(p.marketplace)+'</span>':'')+(p.espessura?'<span class="chip">'+esc(p.espessura)+'</span>':'')+(p.medidas?'<span class="chip">'+esc(p.medidas)+'</span>':'')+'</div><div class="resp">👷 '+esc(prof?.nome||p.producao_operador_atual||'Sem responsável')+'</div>'+(p.observacao_fixada||p.observacoes?'<div class="obs"><small>OBSERVAÇÃO</small><div>'+esc(p.observacao_fixada||p.observacoes)+'</div></div>':'')+'</div></article>';restart()}function restart(){clearTimeout(timer);bar.style.animation='none';void bar.offsetWidth;bar.style.animation='p 10s linear forwards';if(orders.length>1)timer=setTimeout(()=>{idx=(idx+1)%orders.length;render()},10000)}async function load(){const [{data:o},{data:p}]=await Promise.all([db.from('pedidos').select('*'),db.from('perfis').select('id,nome')]);orders=o||[];profiles=Object.fromEntries((p||[]).map(x=>[x.id,x]));render()}prev.onclick=()=>{idx=(idx-1+orders.length)%orders.length;render()};next.onclick=()=>{idx=(idx+1)%orders.length;render()};full.onclick=()=>document.documentElement.requestFullscreen?.();async function init(){const s=await letErpRequireAuth();if(!s)return;tick();setInterval(tick,1000);load();db.channel('tv-setor-'+stage).on('postgres_changes',{event:'*',schema:'public',table:'pedidos'},load).subscribe()}init();
</script></body></html>
