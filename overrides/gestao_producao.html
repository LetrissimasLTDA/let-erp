<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.png"><link rel="stylesheet" href="factory-suite.css?v=37"><script src="theme.js?v=37"></script><title>LET ERP • Gestão da Produção</title><style>.bottlenecks{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.stage{border:1px solid #e2e8f0;border-radius:13px;padding:12px;background:#fff}.stage strong{font-size:10px}.stage b{font-size:25px;display:block;margin:5px 0}.stage small{font-size:8px;color:#64748b}.stage.risk{border-color:#f59e0b;background:#fffbeb}.stage.danger{border-color:#dc2626;background:#fef2f2}.compare{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.compare-card{border:1px solid #e2e8f0;border-radius:12px;padding:12px}.compare-card small{font-size:8px;color:#64748b;font-weight:950}.compare-card b{font-size:22px;display:block;margin-top:4px}.delta{font-size:9px;font-weight:900;margin-top:4px}.goal{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:8px}.goal-top{display:flex;justify-content:space-between;gap:10px}.sla-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.sla-box{border:1px solid #e2e8f0;border-radius:12px;padding:10px}.sla-box input{width:100%;margin-top:6px}@media(max-width:1000px){.bottlenecks,.sla-grid{grid-template-columns:repeat(3,1fr)}.compare{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.bottlenecks,.sla-grid,.compare{grid-template-columns:1fr}}</style></head><body><header class="topbar"><div><h1>🌡️ Gestão da Produção</h1><p>Gargalos, SLA, comparação entre períodos e metas da fábrica</p></div><a class="btn dark" target="_blank" href="tv_geral.html">📺 PAINEL GERAL DA FÁBRICA</a></header><main class="page"><div class="notice" id="notice"></div><section class="metrics"><div class="metric"><small>ATIVOS AGORA</small><b id="active">0</b></div><div class="metric"><small>EM RISCO DE SLA</small><b id="risk">0</b></div><div class="metric"><small>SLA ESTOURADO</small><b id="over">0</b></div><div class="metric"><small>FINALIZADOS HOJE</small><b id="todayDone">0</b></div></section><section class="panel"><div class="toolbar"><h2>Mapa de gargalos</h2><a class="btn gray" href="kanban.html">ABRIR KANBAN</a></div><div class="bottlenecks" id="bottlenecks" style="margin-top:12px"></div></section><section class="panel"><div class="toolbar"><h2>SLA por etapa</h2><button class="btn dark" id="saveSla">SALVAR SLA</button></div><div class="sla-grid" id="slaGrid" style="margin-top:12px"></div></section><section class="panel"><div class="toolbar"><h2>Comparação entre períodos</h2><div><select class="select" id="compareDays"><option value="7">7 dias</option><option value="15">15 dias</option><option value="30">30 dias</option></select></div></div><div class="compare" id="compare" style="margin-top:12px"></div></section><section class="grid2" style="margin-top:14px"><div class="panel"><div class="toolbar"><h2>Metas da fábrica</h2></div><div id="goals"></div></div><div class="panel"><h2 style="font-size:17px;margin-top:0">Nova meta</h2><div class="grid2"><div class="field"><label>TÍTULO</label><input class="input" id="goalTitle" value="Meta de produção"></div><div class="field"><label>META DE PEDIDOS</label><input class="input" id="goalQty" type="number" min="1" value="70"></div><div class="field"><label>INÍCIO</label><input class="input" id="goalStart" type="date"></div><div class="field"><label>FIM</label><input class="input" id="goalEnd" type="date"></div></div><button class="btn dark" id="createGoal" style="margin-top:10px">CRIAR META</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=37"></script><script src="factory-suite.js?v=37"></script><script>
const db=letErpSupabase;let slas=[],orders=[];function activeOrder(p){return !p.finalizado&&!p.entregue_marketplace&&p.status!=='Pronto'}function elapsed(p){return (Date.now()-new Date(p.etapa_iniciada_em||p.atualizado_em||p.criado_em).getTime())/60000}function slaFor(i){return slas.find(x=>x.etapa===i)||{minutos:60}}
async function loadBase(){const [{data:o},{data:s}]=await Promise.all([db.from('pedidos').select('*'),db.from('sla_etapas').select('*').order('etapa')]);orders=o||[];slas=s||[];const active=orders.filter(activeOrder);document.getElementById('active').textContent=active.length;document.getElementById('risk').textContent=active.filter(p=>elapsed(p)>=slaFor(p.etapa_atual).minutos*.8).length;document.getElementById('over').textContent=active.filter(p=>elapsed(p)>=slaFor(p.etapa_atual).minutos).length;const today=erpDateKey(new Date());document.getElementById('todayDone').textContent=orders.filter(p=>String(p.finalizado_em||'').startsWith(today)).length;document.getElementById('bottlenecks').innerHTML=ERP_STAGES.map((name,i)=>{const arr=active.filter(p=>Number(p.etapa_atual||0)===i),over=arr.filter(p=>elapsed(p)>=slaFor(i).minutos).length,risk=arr.filter(p=>elapsed(p)>=slaFor(i).minutos*.8).length;return '<div class="stage '+(over?'danger':risk?'risk':'')+'"><strong>'+name+'</strong><b>'+arr.length+'</b><small>'+over+' estourados • '+risk+' em risco</small></div>'}).join('');document.getElementById('slaGrid').innerHTML=slas.map(s=>'<div class="sla-box"><strong>'+erpEsc(s.nome)+'</strong><input class="input slaInput" data-stage="'+s.etapa+'" type="number" min="1" value="'+s.minutos+'"><small class="muted">minutos</small></div>').join('');loadGoals();loadCompare()}
async function loadCompare(){const days=Number(document.getElementById('compareDays').value),now=new Date(),currentStart=new Date();currentStart.setDate(now.getDate()-days+1);const prevEnd=new Date(currentStart);prevEnd.setDate(prevEnd.getDate()-1);const prevStart=new Date(prevEnd);prevStart.setDate(prevEnd.getDate()-days+1);const curFrom=erpDateKey(currentStart)+'T00:00:00',curTo=erpDateKey(now)+'T23:59:59',prevFrom=erpDateKey(prevStart)+'T00:00:00',prevTo=erpDateKey(prevEnd)+'T23:59:59';const [{data:c},{data:p}]=await Promise.all([db.from('pedidos').select('id,finalizado_em,atraso_historico,refugos').gte('finalizado_em',curFrom).lte('finalizado_em',curTo),db.from('pedidos').select('id,finalizado_em,atraso_historico,refugos').gte('finalizado_em',prevFrom).lte('finalizado_em',prevTo)]);const metrics=[['Finalizados',(c||[]).length,(p||[]).length],['Refugos',(c||[]).reduce((a,x)=>a+(x.refugos?.length||0),0),(p||[]).reduce((a,x)=>a+(x.refugos?.length||0),0)],['Pedidos com atraso',(c||[]).filter(x=>x.atraso_historico?.length).length,(p||[]).filter(x=>x.atraso_historico?.length).length],['Produção/dia',((c||[]).length/days).toFixed(1),((p||[]).length/days).toFixed(1)]];document.getElementById('compare').innerHTML=metrics.map(([n,a,b])=>{const d=Number(b)?((Number(a)-Number(b))/Number(b)*100):Number(a)?100:0;return '<div class="compare-card"><small>'+n.toUpperCase()+'</small><b>'+a+'</b><div class="delta '+(d>=0?'good-text':'danger-text')+'">'+(d>=0?'▲ ':'▼ ')+Math.abs(d).toFixed(1)+'% vs período anterior</div></div>'}).join('')}
async function loadGoals(){const {data}=await db.from('metas_fabrica').select('*').eq('ativo',true).order('data_inicio',{ascending:false}).limit(10);const el=document.getElementById('goals');if(!(data||[]).length){el.innerHTML='<div class="empty">Nenhuma meta ativa.</div>';return}const html=[];for(const g of data){const {count}=await db.from('pedidos').select('id',{count:'exact',head:true}).gte('finalizado_em',g.data_inicio+'T00:00:00').lte('finalizado_em',g.data_fim+'T23:59:59');const pct=Math.min(100,Math.round((count||0)/g.meta_pedidos*100));html.push('<div class="goal"><div class="goal-top"><strong>'+erpEsc(g.titulo)+'</strong><b>'+(count||0)+' / '+g.meta_pedidos+'</b></div><div class="progress" style="margin-top:8px"><span style="width:'+pct+'%"></span></div><div class="muted" style="font-size:8px;margin-top:5px">'+erpBr(g.data_inicio)+' a '+erpBr(g.data_fim)+' • '+pct+'%</div></div>')}el.innerHTML=html.join('')}
async function init(){if(!(await erpRequire('gestao')))return;const today=erpDateKey(new Date());document.getElementById('goalStart').value=today;document.getElementById('goalEnd').value=today;document.getElementById('saveSla').addEventListener('click',async()=>{for(const input of document.querySelectorAll('.slaInput')){await db.from('sla_etapas').update({minutos:Number(input.value)}).eq('etapa',Number(input.dataset.stage))}erpShowNotice('SLA atualizado.');loadBase()});document.getElementById('compareDays').addEventListener('change',loadCompare);document.getElementById('createGoal').addEventListener('click',async()=>{const payload={titulo:document.getElementById('goalTitle').value.trim(),meta_pedidos:Number(document.getElementById('goalQty').value),data_inicio:document.getElementById('goalStart').value,data_fim:document.getElementById('goalEnd').value,criado_por:(await db.auth.getUser()).data.user.id};if(!payload.titulo||!payload.data_inicio||!payload.data_fim||!payload.meta_pedidos)return alert('Preencha a meta.');const {error}=await db.from('metas_fabrica').insert(payload);if(error)erpShowNotice(error.message,true);else{erpShowNotice('Meta criada.');loadGoals()}});await loadBase();db.channel('gestao-v37').on('postgres_changes',{event:'*',schema:'public',table:'pedidos'},loadBase).subscribe();setInterval(loadBase,60000)}init();
</script></body></html>
