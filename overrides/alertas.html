<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.png"><link rel="stylesheet" href="factory-suite.css?v=37"><script src="theme.js?v=37"></script><title>LET ERP • Alertas</title><style>
.alerts{display:grid;gap:9px}.alert{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;border:1px solid #e2e8f0;border-radius:13px;padding:11px;background:#fff}.ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:18px}.alert.critical .ico{background:#fee2e2}.alert.warning .ico{background:#fef3c7}.alert.info .ico{background:#dbeafe}.alert h3{margin:0;font-size:11px}.alert p{margin:4px 0 0;color:#64748b;font-size:9px;line-height:1.4}.time{font-size:8px;color:#94a3b8;white-space:nowrap}.filterbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.filterbar button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 9px;font-size:9px;font-weight:950;cursor:pointer}.filterbar button.active{background:#083344;color:#fff;border-color:#083344}@media(max-width:650px){.alert{grid-template-columns:38px 1fr}.time{grid-column:2}}
</style></head><body><header class="topbar"><div><h1>🚨 Central de Alertas</h1><p>SLA, pedidos críticos, atrasos, estoque baixo, qualidade e @menções</p></div><button class="btn dark" id="readAll">MARCAR MENÇÕES COMO LIDAS</button></header><main class="page"><div class="notice" id="notice"></div><section class="metrics"><div class="metric"><small>CRÍTICOS</small><b id="mCritical">0</b></div><div class="metric"><small>ATENÇÃO</small><b id="mWarning">0</b></div><div class="metric"><small>MENÇÕES NÃO LIDAS</small><b id="mMentions">0</b></div><div class="metric"><small>TOTAL</small><b id="mTotal">0</b></div></section><section class="panel"><div class="filterbar"><button class="active" data-f="all">TODOS</button><button data-f="critical">CRÍTICOS</button><button data-f="warning">ATENÇÃO</button><button data-f="info">INFORMAÇÕES</button></div><div class="alerts" id="alerts"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=37"></script><script src="factory-suite.js?v=37"></script><script>
const db=letErpSupabase;let alerts=[],filter='all',uid=null;
function active(p){return !p.finalizado&&!p.entregue_marketplace&&p.status!=='Pronto'}
function stageName(p){return ERP_STAGES[Math.min(6,Number(p.etapa_atual||0))]}
function add(level,icon,title,message,pedidoId,time){alerts.push({level,icon,title,message,pedidoId,time})}
function render(){const list=filter==='all'?alerts:alerts.filter(a=>a.level===filter);document.getElementById('mCritical').textContent=alerts.filter(a=>a.level==='critical').length;document.getElementById('mWarning').textContent=alerts.filter(a=>a.level==='warning').length;document.getElementById('mMentions').textContent=alerts.filter(a=>a.kind==='mention').length;document.getElementById('mTotal').textContent=alerts.length;const el=document.getElementById('alerts');if(!list.length){el.innerHTML='<div class="empty">Nenhum alerta neste filtro.</div>';return}el.innerHTML=list.map(a=>'<article class="alert '+a.level+'" '+(a.pedidoId?'style="cursor:pointer" onclick="location.href=\'pedido.html?id='+encodeURIComponent(a.pedidoId)+'\'"':'')+'><div class="ico">'+a.icon+'</div><div><h3>'+erpEsc(a.title)+'</h3><p>'+erpEsc(a.message||'')+'</p></div><div class="time">'+erpEsc(a.time||'')+'</div></article>').join('')}
async function load(){alerts=[];const [{data:o},{data:s},{data:e},{data:n}]=await Promise.all([db.from('pedidos').select('*'),db.from('sla_etapas').select('*'),db.from('estoque').select('id,nome,quantidade,espessura,cor'),db.from('notificacoes').select('*').eq('usuario_id',uid).eq('lida',false).order('criado_em',{ascending:false}).limit(100)]);const slas=Object.fromEntries((s||[]).map(x=>[x.etapa,x]));(o||[]).filter(active).forEach(p=>{const sla=slas[p.etapa_atual]||{minutos:60},mins=(Date.now()-new Date(p.etapa_iniciada_em||p.atualizado_em||p.criado_em).getTime())/60000,ratio=mins/sla.minutos;if(p.prioridade==='Crítico')add('critical','🔥','Pedido crítico #'+p.id,(p.cliente||'')+' • '+stageName(p),p.id);if(p.atrasado)add('critical','⛔','Atraso pendente #'+p.id,(p.cliente||'')+' • '+stageName(p),p.id);if(ratio>=1)add('critical','⏱️','SLA estourado #'+p.id,stageName(p)+' está em '+Math.round(ratio*100)+'% do SLA.',p.id);else if(ratio>=.8)add('warning','⏳','SLA próximo do limite #'+p.id,stageName(p)+' está em '+Math.round(ratio*100)+'% do SLA.',p.id);const today=erpDateKey(new Date());if(p.prazo===today&&Number(p.etapa_atual||0)<=3)add('warning','📅','Pedido de hoje ainda no início da produção #'+p.id,stageName(p)+' • '+(p.cliente||''),p.id);if((p.status==='Em produção'||p.producao_status==='em_andamento')&&!p.responsavel_atual&&!p.producao_operador_atual)add('warning','👷','Pedido sem responsável #'+p.id,'Defina quem está trabalhando neste pedido.',p.id);if(Number(p.etapa_atual)===6&&!p.qualidade_aprovado)add('warning','✅','Checklist de qualidade pendente #'+p.id,'Pedido está em Embalagem e ainda não foi aprovado.',p.id)});(e||[]).filter(x=>Number(x.quantidade)<=5).forEach(x=>add(Number(x.quantidade)===0?'critical':'warning','📦','Estoque '+(Number(x.quantidade)===0?'zerado':'baixo')+' • '+x.nome,'Saldo atual: '+x.quantidade+(x.cor?' • '+x.cor:'')+(x.espessura?' • '+x.espessura:''),null));(n||[]).forEach(x=>{const a={level:'info',icon:'@',title:x.titulo,message:x.mensagem,pedidoId:x.pedido_id,time:new Date(x.criado_em).toLocaleString('pt-BR'),kind:'mention'};alerts.push(a)});render()}
async function init(){if(!(await erpRequire(null)))return;const {data}=await db.auth.getSession();uid=data?.session?.user?.id;await load();document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()}));document.getElementById('readAll').addEventListener('click',async()=>{await db.from('notificacoes').update({lida:true}).eq('usuario_id',uid).eq('lida',false);load()});db.channel('alertas-v37').on('postgres_changes',{event:'*',schema:'public',table:'pedidos'},load).on('postgres_changes',{event:'*',schema:'public',table:'notificacoes',filter:'usuario_id=eq.'+uid},load).subscribe();setInterval(load,60000)}init();
</script></body></html>
