<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.png"><link rel="stylesheet" href="factory-suite.css?v=37"><script src="theme.js?v=37"></script><title>LET ERP • Permissões</title><style>.user-card{border:1px solid #e2e8f0;border-radius:14px;padding:12px;margin-top:10px}.user-head{display:grid;grid-template-columns:46px 1fr 180px auto;gap:10px;align-items:center}.perm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.perm{display:flex;align-items:center;gap:7px;border:1px solid #e5e7eb;border-radius:9px;padding:8px;background:#fafafa;font-size:9px;font-weight:850}.perm input{width:16px;height:16px}@media(max-width:900px){.perm-grid{grid-template-columns:repeat(2,1fr)}.user-head{grid-template-columns:44px 1fr}.user-head .role,.user-head .save{grid-column:2}}@media(max-width:550px){.perm-grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"><div><h1>🔐 Permissões por Função</h1><p>Defina o que cada usuário pode visualizar e alterar no LET ERP</p></div></header><main class="page"><div class="notice" id="notice"></div><section class="panel"><div class="toolbar"><h2>Usuários e funções</h2><input class="input" id="search" placeholder="Pesquisar funcionário..."></div><div id="users"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=37"></script><script src="factory-suite.js?v=37"></script><script>
const db=letErpSupabase;const keys={pedidos_criar:'Criar pedidos',pedidos_editar:'Editar pedidos',pedidos_excluir:'Excluir pedidos',producao_operar:'Operar produção',qualidade_aprovar:'Aprovar qualidade',estoque_gerenciar:'Gerenciar estoque',expedicao_gerenciar:'Gerenciar expedição',financeiro:'Financeiro',marketing:'Marketing',gestao:'Gestão e indicadores',arquivos:'Arquivos do pedido',comentarios:'Comentários',desfazer:'Desfazer ações',usuarios:'Gerenciar acessos',limpeza:'Limpar históricos',permissoes:'Gerenciar permissões'};const roles=['Administrador','Gerência','Produção','Estoque','Expedição','Financeiro','Marketing'];let profiles=[],rows=[];
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const list=profiles.filter(p=>!q||[p.nome,p.email,p.setor].some(v=>String(v||'').toLowerCase().includes(q)));document.getElementById('users').innerHTML=list.map(p=>{const r=rows.find(x=>x.user_id===p.id)||{funcao:'Produção',permissoes:{}};return '<article class="user-card" data-id="'+p.id+'"><div class="user-head"><div class="avatar">'+(p.foto_url?'<img src="'+erpEsc(p.foto_url)+'">':'👤')+'</div><div><strong>'+erpEsc(p.nome||p.email)+'</strong><div class="muted" style="font-size:8px">'+erpEsc(p.setor||'')+' • '+erpEsc(p.email||'')+'</div></div><select class="select role">'+roles.map(x=>'<option '+(x===r.funcao?'selected':'')+'>'+x+'</option>').join('')+'</select><button class="btn dark save">SALVAR</button></div><div class="perm-grid">'+Object.entries(keys).map(([k,label])=>'<label class="perm"><input type="checkbox" data-key="'+k+'" '+(r.permissoes?.[k]?'checked':'')+'> '+label+'</label>').join('')+'</div></article>'}).join('');document.querySelectorAll('.user-card').forEach(card=>{card.querySelector('.role').addEventListener('change',async e=>{const {data}=await db.rpc('erp_permissoes_padrao',{p_funcao:e.target.value});if(data){card.querySelectorAll('[data-key]').forEach(c=>c.checked=!!data[c.dataset.key])}});card.querySelector('.save').addEventListener('click',()=>save(card))})}
async function save(card){const id=card.dataset.id,funcao=card.querySelector('.role').value,permissoes={};card.querySelectorAll('[data-key]').forEach(c=>permissoes[c.dataset.key]=c.checked);const {error}=await db.from('erp_permissoes').upsert({user_id:id,funcao,permissoes,atualizado_em:new Date().toISOString()},{onConflict:'user_id'});if(error)erpShowNotice('Erro: '+error.message,true);else{erpShowNotice('Permissões salvas.');load()}}
async function load(){const [{data:p},{data:r}]=await Promise.all([db.from('perfis').select('*').order('nome'),db.from('erp_permissoes').select('*')]);profiles=p||[];rows=r||[];render()}
async function init(){if(!(await erpRequire('permissoes')))return;document.getElementById('search').addEventListener('input',render);await load()}init();
</script></body></html>
